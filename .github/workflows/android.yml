name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor
        run: |
          npm install
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -n "uses-permission" android/app/src/main/AndroidManifest.xml || true
          npx capacitor-assets generate --android --iconBackgroundColor '#1C4F3C' --splashBackgroundColor '#F3E6EC' || true
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon || (echo 'повтор через 60 с — сбой загрузки зависимостей'; sleep 60; ./gradlew assembleDebug --no-daemon --refresh-dependencies)
          cp app/build/outputs/apk/debug/app-debug.apk ../Magnit.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Magnit-apk
          path: Magnit.apk
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Магнит — последняя сборка
          body: Скачай Magnit.apk на Android-телефон и установи.
          files: Magnit.apk
          make_latest: true
