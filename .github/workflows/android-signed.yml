name: Android signed APK (build / publish)
on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish signed APK to Releases/latest (after testing)?'
        required: true
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Capacitor
        run: |
          npm install
          # Capacitor Share 6 forces */* for every multi-file share. Keep a common
          # MIME type for homogeneous files so Telegram/WhatsApp receive audio or photos.
          python3 - <<'PY'
          import re
          from pathlib import Path
          p = Path('node_modules/@capacitor/share/android/src/main/java/com/capacitorjs/plugins/share/SharePlugin.java')
          s = p.read_text()
          decl = re.search(r'(?m)^([ \t]*)ArrayList<Uri> fileUris = new ArrayList<>\(\);$', s)
          if not decl or s.count('ArrayList<Uri> fileUris = new ArrayList<>();') != 1:
              raise SystemExit('Capacitor Share source changed: fileUris declaration not found uniquely')
          indent = decl.group(1)
          s = s[:decl.end()] + '\n' + indent + 'String sharedType = null;' + s[decl.end():]
          mime = re.search(
              r'(?m)^([ \t]*)String type = getMimeType\(file\);\n'
              r'\1if \(type == null \|\| filesList\.size\(\) > 1\) \{\n'
              r'\1    type = "\*/\*";\n'
              r'\1\}\n'
              r'\1intent\.setType\(type\);',
              s
          )
          if not mime:
              raise SystemExit('Capacitor Share MIME block changed: refusing an unsafe patch')
          mi = mime.group(1)
          mime_replacement = (
              f'{mi}String type = getMimeType(file);\n'
              f'{mi}if (type == null && file.toLowerCase().endsWith(".weba")) {{\n'
              f'{mi}    type = "audio/webm";\n'
              f'{mi}}}\n'
              f'{mi}if (type == null) {{\n'
              f'{mi}    sharedType = "*/*";\n'
              f'{mi}}} else if (sharedType == null) {{\n'
              f'{mi}    sharedType = type;\n'
              f'{mi}}} else if (!sharedType.equals(type)) {{\n'
              f'{mi}    boolean bothImages = sharedType.startsWith("image/") && type.startsWith("image/");\n'
              f'{mi}    sharedType = bothImages ? "image/*" : "*/*";\n'
              f'{mi}}}\n'
              f'{mi}intent.setType(sharedType);'
          )
          s = s[:mime.start()] + mime_replacement + s[mime.end():]
          stream = re.search(
              r'(?m)^([ \t]*)if \(fileUris\.size\(\) > 1\) \{\n'
              r'\1[ \t]+intent\.putExtra\(Intent\.EXTRA_STREAM, fileUris\);\n'
              r'\1\}',
              s
          )
          if not stream:
              raise SystemExit('Capacitor Share stream block changed: refusing an unsafe patch')
          si = stream.group(1)
          stream_replacement = (
              f'{si}if (fileUris.size() > 1) {{\n'
              f'{si}    ClipData clipData = ClipData.newRawUri("", fileUris.get(0));\n'
              f'{si}    for (int i = 1; i < fileUris.size(); i++) {{\n'
              f'{si}        clipData.addItem(new ClipData.Item(fileUris.get(i)));\n'
              f'{si}    }}\n'
              f'{si}    intent.setClipData(clipData);\n'
              f'{si}    intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, fileUris);\n'
              f'{si}}}'
          )
          s = s[:stream.start()] + stream_replacement + s[stream.end():]
          # Re-apply the caption after shareFiles sets the attachment MIME type.
          # Some Android receivers inspect the final Intent extras together with ClipData.
          text_block = re.search(
              r'(?m)^([ \t]*)if \(files != null && files\.length\(\) != 0\) \{\n'
              r'\1[ \t]+shareFiles\(files, intent, call\);\n'
              r'\1\}',
              s
          )
          if not text_block:
              raise SystemExit('Capacitor Share file dispatch block changed: refusing to patch caption handling')
          ti = text_block.group(1)
          text_replacement = (
              text_block.group(0) + '\n' +
              f'{ti}if (text != null && !text.isEmpty()) {{\n'
              f'{ti}    intent.putExtra(Intent.EXTRA_TEXT, text);\n'
              f'{ti}}}'
          )
          s = s[:text_block.start()] + text_replacement + s[text_block.end():]
          if 'import android.content.ClipData;' not in s and 'import android.content.*;' not in s:
              s = s.replace('import android.content.Intent;', 'import android.content.ClipData;\nimport android.content.Intent;', 1)
          p.write_text(s)
          print('Patched Capacitor Share multi-file MIME, ClipData and final caption handling.')
          PY
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          p='android/app/src/main/AndroidManifest.xml';s=open(p).read()
          for permission in ('CAMERA', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS'):
              if 'android.permission.' + permission not in s:
                  s=s.replace('</manifest>', '    <uses-permission android:name="android.permission.' + permission + '" />\n</manifest>')
          if 'SendIntentActivity' not in s:
              act='''        <activity android:name="de.mindlib.sendIntent.SendIntentActivity" android:label="@string/app_name" android:exported="true" android:theme="@style/AppTheme.NoActionBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.SEND_MULTIPLE" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="image/*" />
                      </intent-filter>
                  </activity>
              </application>'''
              s=s.replace('</application>',act,1)
          open(p,'w').write(s)
          PY
          grep -n "uses-permission\|SendIntentActivity" android/app/src/main/AndroidManifest.xml || true
          npx capacitor-assets generate --android --iconBackgroundColor '#063E31' --splashBackgroundColor '#F3E6EC'
          npx cap sync android
          python3 native-asr/install.py
          # White monochrome approved ring for Android's notification status bar.
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_ring.png android/app/src/main/res/drawable/ic_stat_ring.png
      - name: Configure release signing (secrets required)
        env:
          MAGNIT_KEYSTORE_BASE64: ${{ secrets.MAGNIT_KEYSTORE_BASE64 }}
          MAGNIT_KEYSTORE_PASSWORD: ${{ secrets.MAGNIT_KEYSTORE_PASSWORD }}
          MAGNIT_KEY_ALIAS: ${{ secrets.MAGNIT_KEY_ALIAS }}
          MAGNIT_KEY_PASSWORD: ${{ secrets.MAGNIT_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          for var in MAGNIT_KEYSTORE_BASE64 MAGNIT_KEYSTORE_PASSWORD MAGNIT_KEY_ALIAS MAGNIT_KEY_PASSWORD; do
            if [ -z "${!var:-}" ]; then echo "Missing secret: $var"; exit 1; fi
          done
          printf '%s' "$MAGNIT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/magnit-release.jks"
          test -s "$RUNNER_TEMP/magnit-release.jks"
          python3 - <<'PYCODE'
          import os,re,pathlib
          path=pathlib.Path('android/app/build.gradle')
          s=path.read_text()
          code=100000+int(os.environ['BUILD_NUMBER'])
          s,n=re.subn(r'versionCode\s+\d+',f'versionCode {code}',s,count=1)
          if n!=1:raise RuntimeError('versionCode not found')
          s,n=re.subn(r'versionName\s+"[^"]+"','versionName "0.9.15"',s,count=1)
          if n!=1:raise RuntimeError('versionName not found')
          if 'signingConfigs {' in s:raise RuntimeError('unexpected existing signing config: inspect manually')
          signing='''signingConfigs {
              release {
                  storeFile file(System.getenv('RUNNER_TEMP') + '/magnit-release.jks')
                  storePassword System.getenv('MAGNIT_KEYSTORE_PASSWORD')
                  keyAlias System.getenv('MAGNIT_KEY_ALIAS')
                  keyPassword System.getenv('MAGNIT_KEY_PASSWORD')
              }
          }
          '''
          s,n=re.subn(r'(?m)^(\s*)buildTypes\s*\{',lambda m:m.group(1)+signing+'\n'+m.group(0),s,count=1)
          if n!=1:raise RuntimeError('buildTypes not found')
          s,n=re.subn(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1)
          if n!=1:raise RuntimeError('release buildType not found')
          path.write_text(s)
          print('Release signing configured; versionCode:',code)
          PYCODE
      - name: Build signed release APK
        working-directory: android
        env:
          MAGNIT_KEYSTORE_PASSWORD: ${{ secrets.MAGNIT_KEYSTORE_PASSWORD }}
          MAGNIT_KEY_ALIAS: ${{ secrets.MAGNIT_KEY_ALIAS }}
          MAGNIT_KEY_PASSWORD: ${{ secrets.MAGNIT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../Magnit-signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Magnit-signed-apk
          path: Magnit-signed.apk
          retention-days: 14

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "${TOOLS_DIR}/apksigner"
          "${TOOLS_DIR}/apksigner" verify --verbose Magnit-signed.apk

      - name: Publish signed APK to Releases/latest (manual approval only)
        if: ${{ inputs.publish_release == true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub Actions artifact keeps its own filename; the public release asset is Magnit.apk.
          cp Magnit-signed.apk Magnit.apk
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --title 'Магнит — последняя подписанная сборка' --notes 'Подписанная сборка для тестирования. Перед установкой убедитесь, что данные старого приложения сохранены.' --latest
          fi
          gh release upload latest Magnit.apk --clobber
          gh release edit latest --title 'Магнит — последняя подписанная сборка' --latest
